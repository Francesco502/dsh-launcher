name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-gnu:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Configure bundled MinGW linker
        shell: pwsh
        run: |
          $mingwBin = @("C:\mingw64\bin", "C:\msys64\mingw64\bin") |
            Where-Object { Test-Path -LiteralPath (Join-Path $_ "gcc.exe") -PathType Leaf } |
            Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($mingwBin)) {
            throw "The pinned Windows runner does not contain a supported MinGW x64 gcc.exe."
          }
          $gcc = Join-Path $mingwBin "gcc.exe"
          $mingwBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $gcc --version

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.0 --profile minimal --target x86_64-pc-windows-gnu --component rustfmt --component clippy
          rustup run 1.97.0 rustc --version
          rustup run 1.97.0 cargo fmt --version
          rustup run 1.97.0 cargo clippy --version

      - name: Validate source release metadata
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --format-version 1 | ConvertFrom-Json
          $package = @($metadata.packages | Where-Object { $_.name -eq "dsh-launcher" }) | Select-Object -First 1
          if ($null -eq $package) {
            throw "Cargo package dsh-launcher was not found."
          }
          & .github\scripts\validate-release.ps1 -Tag "v$($package.version)"

      - name: Format check
        run: cargo fmt --check --all

      - name: Test GNU target
        run: cargo test --locked --target x86_64-pc-windows-gnu

      - name: Clippy GNU target
        run: cargo clippy --locked --all-targets --target x86_64-pc-windows-gnu -- -D warnings

      - name: Build GNU release
        run: cargo build --locked --release --target x86_64-pc-windows-gnu --bins

      - name: Embed application icons
        shell: pwsh
        run: |
          $releaseDir = "target\x86_64-pc-windows-gnu\release"
          & "$releaseDir\embed_icon.exe" "$releaseDir\dsh-launcher.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "Icon embedding failed with exit code $LASTEXITCODE."
          }

      - name: Prepare portable bundle
        shell: pwsh
        run: |
          $releaseDir = "target\x86_64-pc-windows-gnu\release"
          & .github\scripts\prepare-portable.ps1 `
            -LauncherPath "$releaseDir\dsh-launcher.exe" `
            -OutputZip "dist\DSH-Launcher-Portable-x64.zip"

      - name: Smoke test portable bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $smokeRoot = Join-Path $env:USERPROFILE "dsh-launcher-ci-smoke-$PID"
          Expand-Archive -LiteralPath "dist\DSH-Launcher-Portable-x64.zip" -DestinationPath $smokeRoot -Force
          $launcher = Join-Path $smokeRoot "DSH-Launcher-Portable-x64\DSH-Launcher.exe"
          $stdoutPath = Join-Path $smokeRoot "release-smoke.stdout.log"
          $stderrPath = Join-Path $smokeRoot "release-smoke.stderr.log"
          try {
            $process = Start-Process -FilePath $launcher `
              -ArgumentList "--release-smoke" `
              -Wait -PassThru -NoNewWindow `
              -RedirectStandardOutput $stdoutPath `
              -RedirectStandardError $stderrPath
          } catch {
            Write-Output "::error title=Portable initialization smoke test could not start::$($_.Exception.Message)"
            throw
          }
          $output = @(
            if (Test-Path -LiteralPath $stdoutPath) { Get-Content -LiteralPath $stdoutPath }
            if (Test-Path -LiteralPath $stderrPath) { Get-Content -LiteralPath $stderrPath }
          )
          $exitCode = $process.ExitCode
          $output | ForEach-Object { Write-Output $_ }
          if ($exitCode -ne 0) {
            $summary = (($output | ForEach-Object { [string]$_ }) -join " ").Replace("`r", "").Replace("`n", " ")
            Write-Output "::error title=Portable initialization smoke test failed::$summary"
            throw "Extracted portable bundle initialization smoke test failed with exit code $exitCode."
          }
